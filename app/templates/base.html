<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}PulseBoard{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}" />
</head>
<body>
  <nav class="navbar">
    <a class="navbar-brand" href="{{ url_for('feed.index') }}">PulseBoard</a>
    <div class="nav-links">
      {% if current_user.is_authenticated %}
        <a href="{{ url_for('feed.index') }}">Feed</a>
        <a href="{{ url_for('profile.index') }}">Collections</a>
        <a href="{{ url_for('profile.settings') }}">Settings</a>
        <a href="{{ url_for('auth.logout') }}">Logout</a>
      {% else %}
        <a href="{{ url_for('auth.login') }}">Login</a>
      {% endif %}
    </div>
  </nav>

  <main class="container">
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, message in messages %}
        <div class="alert alert-{{ category }}">{{ message }}</div>
      {% endfor %}
    {% endwith %}

    {% block content %}{% endblock %}
  </main>
</body>
</html>
